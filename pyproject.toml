[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "context-anchor-operator"
version = "0.2.0"
description = "Robô operador local com Central Web, navegador e ações controladas de desktop"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "playwright>=1.54,<2",
  "pyautogui>=0.9.54,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
# Comandos principais, pensados para uso humano e aprendizado.
central = "context_anchor.control_plane:main"
robo = "context_anchor.local_agent:run"
parar-robo = "context_anchor.emergency_stop:main"
diagnostico-robo = "context_anchor.doctor:main"

# Compatibilidade com os nomes técnicos usados nas primeiras versões.
context-anchor-control = "context_anchor.control_plane:main"
context-anchor-agent = "context_anchor.local_agent:run"
context-anchor-stop = "context_anchor.emergency_stop:main"
context-anchor-doctor = "context_anchor.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
